<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morux — Mühendislik Stüdyosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#111418; --bg-dark-2:#1A1F23; --bg-light:#FAFAF8; --surface-light:#FFFFFF;
    --ink:#12161A; --ink-dim:#57686B; --foam:#F3F6F6; --foam-dim:#9FB4B6;
    --teal:#0F6E7A; --teal-2:#17919F; --mint:#3FA79C; --mint-2:#84DED0;
    --line-dark:rgba(243,246,246,0.14); --line-light:rgba(18,22,26,0.10);
    --pad-top:env(safe-area-inset-top,0px); --pad-bottom:env(safe-area-inset-bottom,0px);
    --font-head:'Fraunces',serif; --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;scroll-padding-top:80px;overflow-x:hidden;}
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto;} *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }
  body{margin:0;padding-bottom:var(--pad-bottom);background:var(--bg-light);color:var(--ink);font-family:var(--font-body);line-height:1.65;overflow-x:hidden;}
  html[dir="rtl"] body{font-family:'Noto Kufi Arabic',var(--font-body);}
  html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:'Noto Kufi Arabic',var(--font-body) !important;}
  h1,h2,h3{font-family:var(--font-head);line-height:1.18;margin:0;font-weight:600;}
  a{color:inherit;text-decoration:none;}
  svg{max-width:100%;display:block;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  section{position:relative;}
  .on-dark{background:var(--bg-dark);color:var(--foam);}
  .on-dark .dim{color:var(--foam-dim);}
  .on-light{background:var(--bg-light);color:var(--ink);}
  .on-light .dim{color:var(--ink-dim);}

  header{position:sticky;top:0;z-index:50;padding-top:var(--pad-top);background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-light);}
  nav{position:relative;display:flex;align-items:center;justify-content:space-between;padding:13px 24px;max-width:1080px;margin:0 auto;}
  .logo{display:flex;align-items:center;}
  .logo img{height:26px;width:auto;display:block;}
  .navlinks{display:flex;align-items:center;gap:26px;font-size:0.92rem;font-weight:500;color:var(--ink-dim);}
  .navlinks a:hover{color:var(--teal);}
  .langsw{display:flex;gap:2px;border:1px solid var(--line-light);border-radius:7px;overflow:hidden;}
  .langsw button{background:none;border:none;color:var(--ink-dim);font-size:0.78rem;font-weight:700;padding:6px 10px;cursor:pointer;font-family:var(--font-body);}
  .langsw button.active{background:var(--teal);color:#fff;}
  .nav-cta{background:var(--teal);color:#fff;padding:10px 18px;border-radius:7px;font-weight:700;font-size:0.88rem;}
  .nav-cta:hover{background:var(--teal-2);}
  .burger{display:none;background:none;border:none;color:var(--ink);cursor:pointer;padding:6px;}
  @media (max-width:800px){
    .navlinks{position:absolute;top:100%;left:0;right:0;background:var(--surface-light);flex-direction:column;align-items:stretch;gap:0;padding:6px 24px 16px;border-bottom:1px solid var(--line-light);display:none;}
    .navlinks.open{display:flex;}
    .navlinks a{padding:13px 0;border-bottom:1px solid var(--line-light);}
    .navlinks .langsw{margin:14px 0;align-self:flex-start;}
    .nav-cta{display:none;}
    .burger{display:block;}
  }

  .hero{padding:80px 0 96px;background:var(--bg-dark);
    background-image:linear-gradient(var(--line-dark) 1px, transparent 1px),linear-gradient(90deg, var(--line-dark) 1px, transparent 1px);
    background-size:44px 44px; background-position:center top;}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 700px 420px at 20% 0%, rgba(17,20,24,0.55), var(--bg-dark) 70%);}
  .hero-inner{position:relative;display:grid;grid-template-columns:1.15fr 0.85fr;gap:44px;align-items:center;}
  @media (max-width:820px){.hero-inner{grid-template-columns:1fr;}}
  .hero-content{opacity:0;animation:fadein .7s ease .1s forwards;}
  @keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .eyebrow{color:var(--mint-2);font-weight:700;font-size:0.85rem;letter-spacing:0.02em;margin-bottom:16px;text-transform:uppercase;}
  .hero h1{font-size:clamp(2rem,4.2vw,3.1rem);color:var(--foam);font-weight:600;}
  .hero h1 em{font-style:italic;color:var(--teal-2);}
  .hero p{margin-top:18px;max-width:48ch;font-size:1.08rem;color:var(--foam-dim);}
  .hero-ctas{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:7px;font-weight:700;font-size:0.92rem;transition:background .2s ease,border-color .2s ease;}
  .btn-primary{background:var(--mint);color:#fff;}
  .btn-primary:hover{background:var(--mint-2);}
  .btn-ghost{border:1.5px solid var(--line-dark);color:var(--foam);}
  .btn-ghost:hover{border-color:var(--teal-2);color:var(--teal-2);}
  .hero-art{height:300px;position:relative;}
  .hero-art svg{position:absolute;inset:0;width:100%;height:100%;}

  .section-head{max-width:560px;margin-bottom:44px;}
  .kicker{color:var(--teal);font-weight:700;font-size:0.8rem;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:10px;}
  .on-dark .kicker{color:var(--teal-2);}
  .section-head h2{font-size:clamp(1.6rem,2.8vw,2.2rem);}
  .section-head p{margin-top:12px;font-size:1.02rem;}

  .story{padding:88px 0;border-bottom:1px solid var(--line-light);}
  .story-inner{display:grid;grid-template-columns:0.8fr 1.2fr;gap:52px;align-items:center;}
  @media (max-width:820px){.story-inner{grid-template-columns:1fr;}}
  .story-art{height:240px;}
  .story p{font-size:1.02rem;margin-bottom:15px;color:var(--ink-dim);}
  .story strong{color:var(--ink);}
  .pullquote{margin:20px 0;padding:16px 20px;border-inline-start:3px solid var(--teal);font-family:var(--font-head);font-style:italic;font-size:1.05rem;color:var(--ink);background:rgba(15,110,122,0.06);}
  html[dir="rtl"] .pullquote{font-family:'Noto Kufi Arabic';font-style:normal;}
  .timeline{margin-top:24px;}
  .tl-row{display:grid;grid-template-columns:100px 1fr;gap:16px;padding:13px 0;border-top:1px solid var(--line-light);}
  .tl-row:last-child{border-bottom:1px solid var(--line-light);}
  .tl-year{color:var(--teal);font-weight:700;font-family:var(--font-head);font-size:0.85rem;}
  .tl-text{font-size:0.94rem;color:var(--ink-dim);}
  .tl-text strong{color:var(--ink);}

  .services{padding:88px 0;}
  .svc-row{display:grid;grid-template-columns:56px 1fr;gap:20px;padding:26px 0;border-top:1px solid var(--line-light);}
  .svc-row:last-child{border-bottom:1px solid var(--line-light);}
  .svc-num{font-family:var(--font-head);font-size:1.05rem;color:var(--teal);font-weight:600;padding-top:2px;}
  .svc-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .svc-row h3{font-size:1.12rem;}
  .svc-row p{font-size:0.97rem;color:var(--ink-dim);margin:8px 0 6px;max-width:62ch;}
  .svc-example{font-size:0.85rem;color:var(--teal);font-weight:600;}
  .advice-box{margin-top:30px;padding:26px 28px;border-radius:10px;background:var(--bg-dark);color:var(--foam);}
  .advice-box .kicker{color:var(--mint-2);}
  .advice-box p{color:var(--foam-dim);font-size:0.98rem;max-width:72ch;}
  .advice-box strong{color:var(--foam);}

  .values{padding:86px 0;}
  .val-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;}
  @media (max-width:760px){.val-grid{grid-template-columns:1fr;}}
  .val-num{font-family:var(--font-head);color:var(--teal-2);font-size:0.9rem;margin-bottom:10px;}
  .val-item h3{font-size:1.1rem;margin-bottom:8px;}
  .val-item p{font-size:0.95rem;}

  .contact{padding:96px 0 80px;text-align:center;background:var(--bg-dark);}
  .contact h2{font-size:clamp(1.7rem,3.2vw,2.3rem);max-width:18ch;margin:0 auto;color:var(--foam);}
  .contact p{margin:16px auto 28px;max-width:48ch;font-size:1rem;color:var(--foam-dim);}
  .contact-ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .socials{margin-top:32px;display:flex;gap:16px;justify-content:center;}
  .socials a{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-dark);display:flex;align-items:center;justify-content:center;}
  .socials a:hover{border-color:var(--teal-2);}
  .socials svg{width:16px;height:16px;stroke:var(--foam-dim);}
  .socials a:hover svg{stroke:var(--teal-2);}

  footer{padding:26px 24px;border-top:1px solid var(--line-dark);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;color:var(--foam-dim);font-size:0.82rem;max-width:1080px;margin:0 auto;background:var(--bg-dark);padding-bottom:calc(26px + var(--pad-bottom));}
</style>
</head>

var langNames={tr:"TR",en:"EN",ar:"AR"};
function buildLangSwitch(container){
  container.innerHTML="";
  Object.keys(langNames).forEach(function(l){
    var b=document.createElement('button');
    b.textContent=langNames[l];
    b.onclick=function(){setLang(l);};
    b.dataset.lang=l;
    container.appendChild(b);
  });
}
function getByPath(obj,path){return path.split('.').reduce(function(o,k){return o&&o[k];},obj);}

function setLang(lang){
  document.documentElement.lang=lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var val=getByPath(dict[lang], el.getAttribute('data-i18n'));
    if(val!==undefined) el.innerHTML=val;
  });
  var list=document.getElementById('svc-list');
  list.innerHTML='';
  dict[lang].services.list.forEach(function(s,i){
    var row=document.createElement('div');
    row.className='svc-row';
    row.innerHTML='<div class="svc-num">0'+(i+1)+'</div><div><div class="svc-title-row"><h3>'+s[0]+'</h3></div><p>'+s[1]+'</p><div class="svc-example">'+s[2]+'</div></div>';
    list.appendChild(row);
  });
  document.querySelectorAll('.langsw button').forEach(function(b){
    b.classList.toggle('active', b.dataset.lang===lang);
  });
  var nav=document.getElementById('navlinks');
  if(nav) nav.classList.remove('open');
}

buildLangSwitch(document.getElementById('langsw-desktop'));
buildLangSwitch(document.getElementById('langsw-mobile'));
setLang('tr');

var burger=document.getElementById('burger');
var navlinks=document.getElementById('navlinks');
burger.addEventListener('click',function(){navlinks.classList.toggle('open');});
</script>
